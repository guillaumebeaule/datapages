<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taux de prévalence (pour 100 000 personnes) des principales maladies chroniques selon le territoire, 2023-2024</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px}select{padding:8px;margin:10px;width:300px}#resultat{margin-top:20px;font-size:1.2em;font-weight:bold}h2{text-align:center}</style></head><body><h2>Taux de prévalence (pour 100 000 personnes) des principales maladies chroniques selon le territoire, 2023-2024</h2><label>Maladie :</label><br><select id="maladie"></select><br><label>Territoire :</label><br><select id="territoire"></select><div id="resultat"></div><script>const data={"Témiscamingue":{"Asthme":12,"Cardiopathie":5,"Diabète":11,"Hypertension":8,"MPOC":12},"Rouyn-Noranda":{"Asthme":14,"Cardiopathie":6,"Diabète":9,"Hypertension":12,"MPOC":21},"Abitibi-Ouest":{"Asthme":13,"Cardiopathie":11,"Diabète":8,"Hypertension":11,"MPOC":10},"Abitibi":{"Asthme":21,"Cardiopathie":9,"Diabète":11,"Hypertension":9,"MPOC":13},"Vallée-de-l'Or":{"Asthme":22,"Cardiopathie":12,"Diabète":9,"Hypertension":10,"MPOC":15},"Abitibi-Témiscamingue":{"Asthme":23,"Cardiopathie":11,"Diabète":3,"Hypertension":45,"MPOC":12},"Québec":{"Asthme":32,"Cardiopathie":32,"Diabète":33,"Hypertension":12,"MPOC":33}};const maladies=["Asthme","Cardiopathie","Diabète","Hypertension","MPOC"];const territoires=Object.keys(data);const m=document.getElementById('maladie');const t=document.getElementById('territoire');maladies.forEach(x=>m.add(new Option(x,x)));territoires.forEach(x=>t.add(new Option(x,x)));function maj(){document.getElementById('resultat').textContent='Valeur : '+data[t.value][m.value];}m.onchange=maj;t.onchange=maj;maj();</script></body></html>
